name: Build, Test and Format
on:
  pull_request:
jobs:
  build:
    name: Build, Test and Format
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install the Nullify CLI version the action pins
        id: install
        run: |
          version="$(sed -n '/^  nullify-version:/,/default:/s/^    default: "\(.*\)"$/\1/p' action.yml)"
          test -n "$version"
          echo "Installing Nullify CLI ${version}"
          cli="$(NULLIFY_VERSION="$version" scripts/install_cli.sh)"
          echo "path=${cli}" >> "$GITHUB_OUTPUT"
      - name: Test the Nullify CLI interface the action calls
        env:
          NULLIFY_CLI: ${{ steps.install.outputs.path }}
        run: |
          "$NULLIFY_CLI" --version
          help="$("$NULLIFY_CLI" pentest --help)"
          for flag in --app-id --app-name --target-host; do
            grep -q -- "$flag" <<< "$help" || { echo "nullify pentest has no $flag"; exit 1; }
          done
      - name: Format README
        run: |
          npm install -g markdown-table-formatter
          markdown-table-formatter README.md
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: README.md
          commit_message: update readme
