name: 'Nullify DAST Action'
description: 'Request a Nullify pentest assessment of your application'
branding:
  icon: 'activity'
  color: 'purple'
inputs:
  nullify-host:
    description: Your Nullify instance, e.g. acme.nullify.ai
    required: true
  app-id:
    description: ID of the application to assess, as shown in the Nullify dashboard
    required: false
  app-name:
    description: Name of the application to assess, used when app-id is not set
    required: false
  target-host:
    description: URL of the deployment to assess, needed when the application has more than one deployment
    required: false
  base-args:
    description: Space-separated global CLI arguments (e.g. -d, -v for debug and verbose modes)
    required: false
    default: "-v"
  github-token:
    description: GitHub token which will be exchanged for a Nullify token
    required: false
    default: ${{ github.token }}
  nullify-version:
    description: Nullify CLI version to be used
    required: false
    default: "0.29.0"
  os-arch:
    description: Nullify CLI platform, e.g. linux_amd64. Detected from the runner when empty
    required: false
    default: ""
outputs:
  scan_id:
    description: ID of the requested pentest scan
    value: ${{ steps.request.outputs.scan_id }}
  status:
    description: Status of the scan. It is awaiting_manual while Nullify reviews the request
    value: ${{ steps.request.outputs.status }}

runs:
  using: "composite"
  steps:
    - name: Install Nullify CLI
      id: install
      shell: bash
      env:
        NULLIFY_VERSION: ${{ inputs.nullify-version }}
        NULLIFY_OS_ARCH: ${{ inputs.os-arch }}
      run: |
        cli="$("${GITHUB_ACTION_PATH}/scripts/install_cli.sh")"
        echo "path=${cli}" >> "$GITHUB_OUTPUT"
    - name: Request Nullify pentest assessment
      id: request
      shell: bash
      env:
        NULLIFY_CLI: ${{ steps.install.outputs.path }}
        NULLIFY_HOST: ${{ inputs.nullify-host }}
        NULLIFY_GITHUB_OWNER_ID: ${{ github.repository_owner_id }}
        GITHUB_TOKEN_INPUT: ${{ inputs.github-token }}
        APP_ID: ${{ inputs.app-id }}
        APP_NAME: ${{ inputs.app-name }}
        TARGET_HOST: ${{ inputs.target-host }}
        BASE_ARGS: ${{ inputs.base-args }}
      run: |
        if [ -z "$NULLIFY_HOST" ]; then
          echo "::error::nullify-host is required: set it to your Nullify instance, e.g. acme.nullify.ai"
          exit 1
        fi
        if [ -z "$APP_ID" ] && [ -z "$APP_NAME" ]; then
          echo "::error::set app-id or app-name"
          exit 1
        fi

        args=(pentest)
        if [ -n "$APP_ID" ]; then
          args+=(--app-id "$APP_ID")
        fi
        if [ -n "$APP_NAME" ]; then
          args+=(--app-name "$APP_NAME")
        fi
        if [ -n "$TARGET_HOST" ]; then
          args+=(--target-host "$TARGET_HOST")
        fi
        read -r -a base_args <<< "$BASE_ARGS"

        result="$("$NULLIFY_CLI" "${base_args[@]}" --host "$NULLIFY_HOST" --github-token "$GITHUB_TOKEN_INPUT" "${args[@]}")"
        echo "$result"

        scan_id="$(jq -r '.scan_id' <<< "$result")"
        status="$(jq -r '.status' <<< "$result")"
        {
          echo "scan_id=${scan_id}"
          echo "status=${status}"
        } >> "$GITHUB_OUTPUT"

        if [ "$(jq -r '.awaiting_review' <<< "$result")" = "true" ]; then
          message="Requested a pentest assessment. Nullify reviews the request before the pentest runs, so scan ${scan_id} is awaiting review."
        else
          message="Pentest scan ${scan_id} is ${status}."
        fi
        echo "::notice::${message}"
        echo "${message}" >> "$GITHUB_STEP_SUMMARY"
